<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Life.Human — Editor</title>
    <!-- Absolute, deliberately. Left to resolve relatively, "/admin" without a
         trailing slash looks for /config.yml at the site root and 404s; only
         "/admin/" happens to work. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Netlify Identity handles the login, so the editor needs no OAuth app
         of its own, no API keys and no GitHub account for the writer. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
  </body>
</html>
